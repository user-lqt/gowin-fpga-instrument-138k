<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#263238"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #102027; }
      .head { font: 700 22px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #102027; }
      .text { font: 17px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #263238; }
      .small { font: 15px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #455a64; }
      .tiny { font: 13px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #546e7a; }
      .box { stroke: #263238; stroke-width: 2; rx: 10; }
      .dim { stroke: #546e7a; stroke-width: 2; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .wire { stroke: #263238; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #607d8b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
  </defs>

  <rect width="1500" height="960" fill="#f7fafb"/>
  <text x="55" y="52" class="title">方案三：两个普通导电胶按键错开安装的双触点琴键样机</text>
  <text x="55" y="82" class="small">同一个亚克力琴键先压触点 A，再压触点 B；FPGA 测量两次闭合的时间差。</text>

  <text x="55" y="135" class="head">一、侧面机械剖面</text>
  <rect x="55" y="165" width="900" height="540" class="box" fill="#ffffff"/>

  <!-- key -->
  <path d="M155 245 L840 245 L840 315 L390 315 L350 385 L155 385 Z" fill="#b3e5fc" stroke="#1565c0" stroke-width="3"/>
  <text x="430" y="285" class="text">亚克力琴键</text>
  <text x="165" y="226" class="small">按压方向 ↓</text>
  <path d="M255 145 V225" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="810" cy="360" r="17" fill="#78909c" stroke="#263238" stroke-width="2"/>
  <text x="770" y="410" class="small">后端转轴</text>
  <path d="M810 315 V360" class="dash"/>

  <!-- posts -->
  <rect x="275" y="385" width="58" height="68" class="box" fill="#90caf9"/>
  <text x="282" y="475" class="small">推杆 A</text>
  <rect x="560" y="385" width="58" height="42" class="box" fill="#90caf9"/>
  <text x="565" y="475" class="small">推杆 B</text>

  <!-- silicone A/B -->
  <path d="M245 453 Q304 410 363 453 L350 526 L258 526 Z" fill="#424242" stroke="#212121" stroke-width="3"/>
  <path d="M530 427 Q589 395 648 427 L635 500 L543 500 Z" fill="#424242" stroke="#212121" stroke-width="3"/>
  <text x="263" y="555" class="text">硅胶开关 A</text>
  <text x="546" y="530" class="text">硅胶开关 B</text>
  <text x="245" y="585" class="tiny">黑色导电触点朝下</text>
  <text x="528" y="560" class="tiny">黑色导电触点朝下</text>

  <!-- PCB -->
  <rect x="130" y="625" width="735" height="42" class="box" fill="#66bb6a"/>
  <text x="430" y="652" class="text" fill="#ffffff">单键触点 PCB</text>
  <rect x="255" y="605" width="78" height="20" class="box" fill="#d4a017"/>
  <rect x="540" y="605" width="78" height="20" class="box" fill="#d4a017"/>
  <text x="270" y="595" class="small">PCB触点 A</text>
  <text x="555" y="595" class="small">PCB触点 B</text>

  <!-- height difference -->
  <path d="M385 500 H505" class="dim"/>
  <text x="395" y="520" class="small">高度/行程差 0.5~1.5 mm 起步调试</text>
  <path d="M365 580 H530" class="dash"/>
  <text x="370" y="603" class="tiny">琴键独立下行限位，不能靠硅胶开关硬顶</text>

  <!-- timing -->
  <rect x="1010" y="165" width="435" height="250" class="box" fill="#e3f2fd"/>
  <text x="1040" y="205" class="head">二、动作顺序</text>
  <text x="1040" y="250" class="text">1. 轻按或重按琴键</text>
  <text x="1040" y="285" class="text">2. A 先闭合，记录 tA</text>
  <text x="1040" y="320" class="text">3. B 后闭合，记录 tB</text>
  <text x="1040" y="365" class="text">4. Δt = tB - tA</text>
  <text x="1040" y="400" class="text">5. Δt 越小，velocity 越大</text>

  <!-- electrical -->
  <rect x="1010" y="455" width="435" height="250" class="box" fill="#fff3e0"/>
  <text x="1040" y="495" class="head">三、单键样机接线</text>
  <text x="1040" y="540" class="text">3.3 V ─ 上拉 ─ FPGA输入 A</text>
  <text x="1040" y="575" class="text">FPGA输入 A ─ 开关 A ─ GND</text>
  <text x="1040" y="625" class="text">3.3 V ─ 上拉 ─ FPGA输入 B</text>
  <text x="1040" y="660" class="text">FPGA输入 B ─ 开关 B ─ GND</text>
  <text x="1040" y="695" class="small">按下时输入由高变低</text>

  <!-- wires from pads to right -->
  <path d="M333 615 C780 615 780 540 1030 540" class="wire"/>
  <path d="M618 615 C815 615 815 625 1030 625" class="wire"/>
  <text x="690" y="570" class="small">触点 A 信号</text>
  <text x="820" y="650" class="small">触点 B 信号</text>

  <!-- validation -->
  <rect x="55" y="755" width="1390" height="145" class="box" fill="#e8f5e9"/>
  <text x="85" y="795" class="head">四、样机验证标准</text>
  <text x="85" y="835" class="text">万用表/逻辑分析仪应看到：松开 → A闭合 → B闭合 → 松开</text>
  <text x="85" y="872" class="text">轻按与重按都必须保持 A 先、B 后；如果两个信号同时变化，就调整推杆高度或加垫片。</text>
</svg>
